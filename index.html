<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏️ XMR Web Miner (Original)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 15px; }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { text-align: center; font-size: 24px; margin-bottom: 10px; background: linear-gradient(90deg, #ff6b00, #ffa500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 18px; margin-bottom: 12px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .stat { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; text-align: center; }
  .stat-label { font-size: 10px; color: #8b949e; margin-bottom: 4px; }
  .stat-value { font-size: 18px; font-weight: bold; color: #58a6ff; font-family: 'Courier New', monospace; }
  .stat-value.orange { color: #ffa500; } .stat-value.green { color: #3fb950; }
  .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; margin: 8px 0; }
  .btn-start { background: linear-gradient(90deg, #238636, #2ea043); color: #fff; }
  .btn-stop { background: linear-gradient(90deg, #da3633, #f85149); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .log { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px; max-height: 220px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 11px; color: #3fb950; direction: ltr; text-align: left; margin-top: 10px; }
  .wallet-input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px; color: #ffa500; font-family: monospace; font-size: 10px; word-break: break-all; margin-bottom: 10px; }
  .warning { background: rgba(255, 193, 7, 0.08); border: 1px solid #ffc107; border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 12px; color: #ffc107; }
</style>
</head>
<body>
<div class="container">
  <h1>⛏️ XMR Web Miner (Original)</h1>
  <div class="warning">
    ⚠️ هذا الإصدار يستخدم البروكسي العام <b>ny1.xmrminingproxy.com</b> الذي قد يكون متوقفًا حاليًا. 
    اضغط "ابدأ" وجرب مرة أخرى كل بضع دقائق.
  </div>

  <div class="card">
    <div style="font-size:11px; color:#8b949e; margin-bottom:6px;">💼 محفظتك (Monero Address):</div>
    <textarea class="wallet-input" id="walletInput" rows="3">44ARej17nLpAK6drFrVhgcY2miSAjPBowK9LkFsTZWdXPDsk5RKnqi3iE59akVkAHV76YRzrNadmWPPtgwZHQuxfSUtWxsk</textarea>
  </div>

  <div class="card">
    <div class="stat-grid">
      <div class="stat"><div class="stat-label">⚡ السرعة</div><div class="stat-value orange" id="hashrate">0 H/s</div></div>
      <div class="stat"><div class="stat-label">📊 Hashes</div><div class="stat-value" id="totalHashes">0</div></div>
      <div class="stat"><div class="stat-label">⏱️ الوقت</div><div class="stat-value green" id="runtime">00:00</div></div>
      <div class="stat"><div class="stat-label">💎 Shares</div><div class="stat-value" id="shares">0</div></div>
    </div>
    <button class="btn btn-start" id="startBtn" onclick="startMining()">▶️ ابدأ التعدين</button>
    <button class="btn btn-stop" id="stopBtn" onclick="stopMining()" disabled>⏹️ أوقف</button>
    <div class="log" id="log"><div class="log-line info">⏳ في انتظار البدء...</div></div>
  </div>
</div>

<!-- ============================================= -->
<!-- 1. استدعاء مكتبة monero-webminer الرسمية   -->
<!-- ============================================= -->
<script src="https://cdn.jsdelivr.net/gh/NajmAjmal/monero-webminer@main/script.js"></script>

<script>
// ==========================================
// 2. إعدادات التشغيل (المتغيرات التي تنتظرها المكتبة)
// ==========================================
const WORKER_NAME = "web_" + Math.floor(Math.random() * 99999);
const PASSWORD = "x";

// نستخدم دائمًا البروكسي العام ومونيرو أوشن (حتى لو كان متوقفًا)
server = "wss://ny1.xmrminingproxy.com";
const POOL = "moneroocean.stream";

// ==========================================
// 3. دالة تحديث الواجهة (تعمل بالتوازي مع المكتبة)
// ==========================================
function updateStats() {
  if (!document.getElementById('log')) return;
  const time = new Date().toLocaleTimeString('en-GB');
  const hashes = document.getElementById('totalHashes')?.innerText || '0';
  // نعتمد على متغيرات المكتبة العالمية
  const hps = (typeof hashesPerSecond !== 'undefined') ? hashesPerSecond : 0;
  const acc = (typeof acceptedHashes !== 'undefined') ? acceptedHashes : 0;
  document.getElementById('hashrate').innerText = hps + ' H/s';
  document.getElementById('shares').innerText = acc;
  document.getElementById('totalHashes').innerText = (typeof totalHashes !== 'undefined') ? totalHashes : '0';
}

// ==========================================
// 4. دوال التحكم (تتصل بالمكتبة)
// ==========================================
async function startMining() {
  const wallet = document.getElementById('walletInput').value.trim();
  if (!wallet || wallet.length < 90) {
    alert("الرجاء إدخال محفظة XMR صحيحة");
    return;
  }
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('log').innerHTML = '<div class="log-line info">⏳ جاري الاتصال بالبروكسي...</div>';
  
  try {
    // استدعاء الدالة الأساسية من المكتبة
    startMining(POOL, wallet, WORKER_NAME, -1, PASSWORD);
    document.getElementById('log').innerHTML += '<div class="log-line ok">✅ تم إرسال أمر البدء للمكتبة</div>';
    // نبدأ بتحديث الواجهة كل ثانية
    setInterval(updateStats, 1000);
  } catch (e) {
    document.getElementById('log').innerHTML += '<div class="log-line error">❌ خطأ: ' + e.message + '</div>';
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
  }
}

function stopMining() {
  if (typeof stopMining === 'function') stopMining();
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('log').innerHTML += '<div class="log-line warn">⏹️ تم إرسال أمر الإيقاف</div>';
}
</script>
</body>
</html>
